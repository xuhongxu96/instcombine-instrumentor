name: pages-redirect

# The only remaining workflow: deploys a static page that redirects the old
# GitHub Pages site to https://xuhongxu.com/llvm-observatory/. All other CI is
# disabled (see .github/workflows-disabled/).

on:
  push:
    branches: [main]
    paths:
      - 'redirect/**'
      - '.github/workflows/pages-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
